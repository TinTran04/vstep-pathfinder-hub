[build]
  command = "npm run build"
  publish = "dist"

# Chuyển tiếp các yêu cầu bắt đầu bằng /api sang Render
[[redirects]]
  from = "/api/*"
  to = "https://vai-api-1z2n.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback cho SPA Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200